<figure {% if fullscreen %} data-mode="fullscreen" {% endif %}>
  <picture>
    <source
      srcset="{% if absolute %}{{ file | replace: '.jpg', '.webp' | replace: '.JPG', '.webp' | replace: '.png', '.webp' }}{% else %}/images/{{ file | replace: '.jpg', '.webp' | replace: '.JPG', '.webp' | replace: '.png', '.webp' }}{% endif %}"
      type="image/webp">
    <img
    {% if absolute %} src="{{file}}" {% else %} src="/images/{{file}}" {% endif %}
    alt="{{ caption | default: 'Imagen de Rutas de los Andes' }}"
    width="{{ width | default: 1200 }}"
    height="{{ height | default: 800 }}"
    loading="lazy"
    decoding="async">
  </picture>
  {% if caption %}
   <figcaption{% if fullscreen %} class="op-extra-large"{% endif %}>
      {{ caption }}
    </figcaption>
  {% endif %}
</figure>
