<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}" prefix="op: http://media.facebook.com/op#">

  {% include head.html %}

  <body class="bg-white text-[#4a4a4a]">

    {% if site.google_analytics %}
    {% include google-analytics.html %}
    {% endif %}

    {% include header.html %}

    <main class="pt-[57px]" aria-label="Content">

      <!-- Category nav -->
      <nav class="border-b border-[#ededed] bg-white" aria-label="Categorías">
        <ul class="m-0 mx-auto flex max-w-[748px] list-none items-center justify-center gap-1.5 px-4 py-2.5 text-[12.5px] font-semibold uppercase tracking-[0.14em]">
          <li>
            <a class="rounded-full px-3.5 py-2 no-underline transition-colors {% if page.url == '/' %}bg-primary/10 text-primary{% else %}text-[#9a9a9a] hover:bg-black/5 hover:text-black{% endif %}" href="/">
              Inicio
            </a>
          </li>
          <li>
            <a class="rounded-full px-3.5 py-2 no-underline transition-colors {% if page.url == '/blog/' or page.url contains '/blog' %}bg-primary/10 text-primary{% else %}text-[#9a9a9a] hover:bg-black/5 hover:text-black{% endif %}" href="/blog">
              Blog
            </a>
          </li>
          <li class="ml-1">
            <a class="inline-flex items-center gap-1.5 rounded-full bg-accent px-4 py-2 text-accent-foreground no-underline shadow-sm transition-all hover:-translate-y-px hover:bg-[#92400e] hover:shadow-md" target="_blank" rel="noopener" href="https://travel.rutasdelosandes.com/">
              Tours de aliados
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="opacity-80"><path d="M7 17 17 7M17 7H9M17 7v8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </a>
          </li>
        </ul>
      </nav>

      {{ content }}
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) { console.log('SW registrado', reg); })
            .catch(function(err) { console.log('SW error', err); });
        });
      }
    </script>
    <script src="/javascript/site.js" defer></script>
  </body>

</html>
