<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}" prefix="op: http://media.facebook.com/op#">

  {% include head.html %}

  <body class="bg-white text-[#4a4a4a]">

    {% if jekyll.environment != "development" %}
    {% if site.google_analytics %}
    {% include google-analytics.html %}
    {% endif %}
    {% endif %}

    {% include header.html %}

    <!-- pt-[57px] compensa el header fixed. El main NO tiene max-width ni padding —
         cada sección interior gestiona su propio ancho. -->
    <main class="pt-[57px]" aria-label="Content">

      <!-- Category nav -->
      <nav class="text-center uppercase text-[#999]" aria-label="Categorías">
        <ul class="m-0 mx-auto flex list-none justify-center gap-0 p-5">
          <li class="px-5">
            <a class="text-[#999] no-underline hover:text-black hover:underline" href="/">
              <span class="pb-[2px]">RUTAS</span>
            </a>
          </li>
          <li class="px-5">
            <a class="text-[#999] no-underline hover:text-black hover:underline" href="/blog">
              <span class="pb-[2px]">BLOG</span>
            </a>
          </li>
          <li class="px-5">
            <a class="font-bold text-black no-underline hover:underline" target="_blank" href="https://randes-store.myshopify.com/">
              <span class="pb-[2px]">TIENDA</span>
            </a>
          </li>
        </ul>
      </nav>

      {{ content }}
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registrado con éxito', reg))
            .catch(err => console.log('Error al registrar Service Worker', err));
        });
      }
    </script>
    <script src="/javascript/site.js" defer></script>
  </body>

</html>
