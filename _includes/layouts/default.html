<!DOCTYPE html>
<html  amp lang="{{ page.lang | default: site.lang | default: "es" }}" prefix="op: http://media.facebook.com/op#">

  {% include head.html %}

  <body>

   <!-- Include google-analytics.html -->
   {% include google-analytics.html %}
 
  <!-- AMP Web Push Extension Configuration -->
  <amp-install-serviceworker src="/service-worker.js" layout="nodisplay"></amp-install-serviceworker>
  
  {% if jekyll.environment != "development" %}
  {% if site.google_analytics %}
  {% include google-analytics.html %}
  {% endif %}
  {% endif %}

    {% include header.html %}
    <main class="page-content" aria-label="Content">
      <div id="categories" class="categories">
          <ul>
              <li>
                  <a href="/"><span>RUTAS</span></a>
              </li>
              <li>
                  <a href="/blog"><span>BLOG</span></a>
              </li>
              <li>
                <a target='_blank' href="https://randes-store.myshopify.com/"><span class="tienda-title">TIENDA</span></a>
              </li>
          </ul>
        </div>
        {{ content }}
    </main>

    <!-- Registro del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('Service Worker registrado con éxito', reg))
          .catch(err => console.log('Error al registrar Service Worker', err));
      });
    }
  </script>
</body>
  </body>

</html>
