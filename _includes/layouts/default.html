<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}" prefix="op: http://media.facebook.com/op#">

  {% include head.html %}

  <body class="bg-background text-foreground antialiased">

    {% if jekyll.environment != "development" %}
    {% if site.google_analytics %}
    {% include google-analytics.html %}
    {% endif %}
    {% endif %}

    {% include header.html %}

    <main class="mx-auto max-w-[calc(768px-20px)] px-[10px] pt-[57px] md:max-w-none md:px-4" aria-label="Content">

      <!-- Category nav -->
      <nav class="border-b border-border bg-white text-center font-sans text-xs uppercase tracking-widest text-[#999]" aria-label="Categorías">
        <ul class="m-0 mx-auto flex list-none justify-center gap-5 p-5">
          <li>
            <a class="text-[#999] no-underline hover:text-black hover:underline" href="/">
              <span>Rutas</span>
            </a>
          </li>
          <li>
            <a class="text-[#999] no-underline hover:text-black hover:underline" href="/blog">
              <span>Blog</span>
            </a>
          </li>
          <li>
            <a class="text-[#999] no-underline hover:text-black hover:underline" target="_blank" href="https://randes-store.myshopify.com/">
              <span>Tienda</span>
            </a>
          </li>
        </ul>
      </nav>

      {{ content }}
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registrado con éxito', reg))
            .catch(err => console.log('Error al registrar Service Worker', err));
        });
      }
    </script>
    <script src="/javascript/site.js" defer></script>
  </body>

</html>
