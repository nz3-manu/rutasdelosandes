<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "es" }}" prefix="op: http://media.facebook.com/op#">

  {% include head.html %}

  <body class="bg-white text-[#4a4a4a]">

    {% if site.google_analytics %}
    {% include google-analytics.html %}
    {% endif %}

    {% include header.html %}

    <main class="pt-[57px]" aria-label="Content">

      <!-- Category nav -->
      <nav class="text-center uppercase text-[#999]" aria-label="Categorías">
        <ul class="m-0 mx-auto flex list-none justify-center gap-0 p-5">
          <li class="px-5">
            <a class="{% if page.url == '/' %}text-black font-bold border-b-2 border-black pb-[2px]{% else %}text-[#999] hover:text-black hover:underline{% endif %} no-underline" href="/">
              <span>INICIO</span>
            </a>
          </li>
          <li class="px-5">
            <a class="{% if page.url == '/blog/' or page.url contains '/blog' %}text-black font-bold border-b-2 border-black pb-[2px]{% else %}text-[#999] hover:text-black hover:underline{% endif %} no-underline" href="/blog">
              <span>BLOG</span>
            </a>
          </li>
          <li class="px-5">
            <a class="font-bold text-black no-underline hover:underline" target="_blank" href="https://randes-store.myshopify.com/">
              <span>TIENDA</span>
            </a>
          </li>
        </ul>
      </nav>

      {{ content }}
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/service-worker.js')
            .then(function(reg) { console.log('SW registrado', reg); })
            .catch(function(err) { console.log('SW error', err); });
        });
      }
    </script>
    <script src="/javascript/site.js" defer></script>
  </body>

</html>
