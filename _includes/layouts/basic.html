<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}" prefix="op: http://media.facebook.com/op#">
  {% include head.html %}

  <body class="bg-background text-foreground antialiased">
    {% if jekyll.environment != "development" and site.google_analytics %}
      {% include google-analytics.html %}
    {% endif %}

    {% include header.html %}

    <main class="mx-auto max-w-[calc(768px-20px)] px-[10px] pt-[57px] md:max-w-none md:px-4" aria-label="Content">
      {{ content }}
    </main>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => console.log('Service Worker registrado con exito', reg))
            .catch(err => console.log('Error al registrar Service Worker', err));
        });
      }
    </script>
    <script src="/javascript/site.js" defer></script>
  </body>
</html>
