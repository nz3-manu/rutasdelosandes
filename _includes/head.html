<head>
  <meta charset="utf-8" />

  <!-- 3. Asignación de Título -->
  {% if seo_title %} {% assign title = seo_title %} {% else %} {% assign title = title %} {% endif %}

  <!-- 4. Metadatos de Verificación y Viewport -->
  <meta name="p:domain_verify" content="60a94ce360c86ef7f44098a262472bd4" />
  <meta name="B-verify" content="845495a2973743e68864405bbd7e35abb9cf42e9" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- 5. Título y Descripción -->
  <title>{{ title | escape }}</title>
  <meta name="description" content="{{ excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 300 | escape }}" />

  <!-- 6. Iconos, Manifest y Tema de Color -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="{{ '/images/favicon-32x32.png' | relative_url }}" sizes="32x32" />
  <link rel="icon" type="image/png" href="{{ '/images/favicon-16x16.png' | relative_url }}" sizes="16x16" />
  <link rel="shortcut icon" href="{{ '/images/favicon-32x32.png' | relative_url }}?v=2" />
  <link rel="apple-touch-icon" href="{{ '/images/favicon-32x32.png' | relative_url }}" />
  <meta name="theme-color" content="#00796b"><!-- Cambia el hex por el color de la marca -->

  <!-- 7. Enlaces Alternate y Canónicos -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}" />
  
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}" />

  <!-- Hreflang protegido para apuntar siempre a la raíz original -->
  <link rel="alternate" hreflang="{{ site.lang | default: 'es' }}" href="{{ page.url | replace:'index.html','' | remove: '/amp' | absolute_url }}" />
  {% if alt_url %}
  <link rel="alternate" hreflang="{{ site.alternative_lang }}" href="{{ site.alternative_url }}{{ alt_url | default: page.url | remove: '/amp' }}" />
  {% endif %}
  <meta property="article:publisher" content="{{ site.url }}" />

  <!-- 8. Metadatos Open Graph (Facebook/LinkedIn) -->
  {% if author %} {% assign authorInfo = authors[author] %} {% endif %}
  <meta property="og:title" content="{{ title | escape }}" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | remove: '/amp' | absolute_url }}" />
  <meta property="og:type" content="article" />
  <meta property="og:image" content="{{ site.url }}{{ images_url }}/featured.jpg" />
  <meta property="article:author" content="{{ authorInfo.facebook }}" />
  <meta property="fb:app_id" content="{{ site.fb_app_id }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta property="og:description" content="{{ excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 300 | escape }}" />
  <meta property="fb:pages" content="{{ site.instant_pages }}" />
  <meta property="og:updated_time" content="{{ 'now' | date: '%Y-%m-%dT%H:%M:%S' }}" />
  <meta property="og:rich_attachment" content="true" />

  <!-- 9. Metadatos Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@{{ site.twitter }}" />
  <meta name="twitter:creator" content="@{{ authorInfo.twitter }}" />
  <meta name="twitter:title" content="{{ title | escape }}" />
  <meta name="twitter:description" content="{{ excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 300 | escape }}" />
  <meta name="twitter:image" content="{{ site.url }}{{ images_url }}/featured.jpg" />

  <style>
    {% include tailwind.css %}
    {% include styles.css %}
  </style>
</head>
