<figure>
  <amp-video
    width="{{width |default: 480}}"
    height="{{height|default: 270}}"
    layout="responsive"
    autoplay
    controls
    loop
  >
    <source type="video/mp4" src="/images/{{ file }}" />
  </amp-video>
  {% if caption %}
  <figcaption>{{caption}}</figcaption>
  {% endif %}
</figure>
